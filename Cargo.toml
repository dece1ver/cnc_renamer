[package]
name = "cnc_remedy"
version = "1.2.3"
edition = "2024"
build = "src/build.rs"

[lib]
name = "cnc_remedy"
path = "src/lib.rs"

[[bin]]
name = "cncr"
path = "src/main.rs"

[[bin]]
name = "cnctt"
path = "src/bin/cnctt/main.rs"

[dependencies]
crossterm = "0.29.0"
registry = "1.3.0"
is_elevated = "0.1.2"
clearscreen = "4.0.5"
unicode-segmentation = "1.12.0"
chrono = "0.4.44"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
encoding_rs = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
filetime = "0.2"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[build-dependencies]
embed-resource = "3"
